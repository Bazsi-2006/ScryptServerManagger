# nginx reverse proxy for Server Manager.
#
# In config.json set:
#   "listen": "127.0.0.1:8080"
#   "public_url": "https://servers.example.com"
#   "trusted_proxies": ["127.0.0.1/32", "::1/128"]

server {
    listen 80;
    listen [::]:80;
    server_name servers.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name servers.example.com;

    ssl_certificate     /etc/letsencrypt/live/servers.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servers.example.com/privkey.pem;

    # Backup downloads can be large; let the application enforce its own
    # limits (backups.max_download_bytes).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The application validates the Origin header against Host and uses
        # these to determine the client address and scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events: no buffering, long-lived responses.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
